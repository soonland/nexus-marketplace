version: 2
updates:
  # Repeat this entry once per detected ecosystem and per directory that contains a manifest
  # (see the ecosystem table in SKILL.md). Add a matching label for each workspace in a monorepo.
  - package-ecosystem: '{{ECOSYSTEM}}'
    directory: '{{DIRECTORY}}'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    # Wait before proposing a brand-new release: a compromised or yanked version is usually caught
    # within days. Security updates are not delayed.
    cooldown:
      default-days: 3
    labels:
      - dependencies
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']

  # Always present, whatever the stack.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    labels:
      - dependencies
    commit-message:
      prefix: 'chore'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
