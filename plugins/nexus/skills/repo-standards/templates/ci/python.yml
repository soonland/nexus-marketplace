name: CI

on:
  push:
    branches: [{{DEFAULT_BRANCH}}]
  pull_request:

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '{{PYTHON_VERSION}}'
          cache: {{PY_CACHE}} # remove this line for uv and pdm

      # Python tool setup (poetry, uv, pdm, pipenv, hatch): add the step from the "Python tooling"
      # table in SKILL.md here. Plain pip needs none.

      - name: Install dependencies
        run: '{{PY_INSTALL}}'

      # Remove any step below the repo does not use, and swap in the linter, typechecker and test
      # runner the repo actually has (see "Python tooling" in SKILL.md). {{PY_RUN}} is empty for pip.
      - name: Lint
        run: '{{PY_RUN}}ruff check .'

      - name: Format check
        run: '{{PY_RUN}}ruff format --check .'

      - name: Typecheck
        run: '{{PY_RUN}}mypy .'

      - name: Test with coverage (≥{{COVERAGE_THRESHOLD}}% threshold)
        run: '{{PY_RUN}}pytest --cov --cov-fail-under={{COVERAGE_THRESHOLD}}'

      # Libraries only (a [build-system] table that the project publishes).
      - name: Build
        run: '{{PY_RUN}}python -m build'
