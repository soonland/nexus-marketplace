name: CI

on:
  push:
    branches: [{{DEFAULT_BRANCH}}]
  pull_request:

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '{{PYTHON_VERSION}}'
          cache: pip # use `poetry` or `pipenv` to match the repo; for uv see astral-sh/setup-uv

      # Use the repo's own install command (pip, poetry install, uv sync, ...).
      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Remove any step below the repo does not use.
      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Typecheck
        run: mypy .

      - name: Test with coverage (≥{{COVERAGE_THRESHOLD}}% threshold)
        run: pytest --cov --cov-fail-under={{COVERAGE_THRESHOLD}}

      - name: Build
        run: python -m build
