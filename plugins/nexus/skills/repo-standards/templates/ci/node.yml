name: CI

on:
  push:
    branches: [{{DEFAULT_BRANCH}}]
  pull_request:

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pnpm only: delete this step for npm, yarn and bun (see "Node package manager" in SKILL.md).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: {{NODE_VERSION}}
          cache: {{PM_CACHE}}

      - name: Install dependencies
        run: '{{PM_INSTALL}}'

      # Remove any step below whose script does not exist in package.json.
      - name: Typecheck
        run: '{{PM_RUN}} typecheck'

      - name: Format check
        run: '{{PM_EXEC}} prettier --check .'

      - name: Lint
        run: '{{PM_RUN}} lint'

      - name: Test with coverage (≥{{COVERAGE_THRESHOLD}}% threshold)
        run: '{{PM_RUN}} test:coverage'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        run: '{{PM_RUN}} build'
