name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Pinned on purpose; bump it deliberately. `validate` needs no login or secrets.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      - name: Validate marketplace and plugin manifests
        run: claude plugin validate .

      - name: Parse YAML and JSON files
        run: |
          ruby -ryaml -rjson -e '
            bad = []
            yaml = Dir.glob(".github/**/*.{yml,yaml}") + Dir.glob("plugins/**/templates/**/*.{yml,yaml}") + Dir.glob("plugins/**/templates/**/*pre-commit-config*")
            json = Dir.glob(".claude-plugin/*.json") + Dir.glob("plugins/**/.claude-plugin/*.json") + Dir.glob("plugins/**/.mcp.json")
            yaml.each { |f| begin; YAML.load_file(f); rescue => e; bad << "#{f}: #{e.message}"; end }
            json.each { |f| begin; JSON.parse(File.read(f)); rescue => e; bad << "#{f}: #{e.message}"; end }
            abort(bad.join("\n")) unless bad.empty?
            puts "parsed #{yaml.size} yaml, #{json.size} json files"
          '

      - name: Check every skill has a docs page
        run: |
          missing=0
          for f in plugins/*/skills/*/SKILL.md; do
            name=$(basename "$(dirname "$f")")
            if [ ! -f "docs/$name.md" ]; then
              echo "::error file=$f::missing docs/$name.md (one human-readable page per skill)"
              missing=1
            fi
          done
          exit $missing
