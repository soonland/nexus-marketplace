name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits so the next steps can compare a PR with the base it merges into.
          fetch-depth: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Pinned on purpose; bump it deliberately. `validate` needs no login or secrets.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      - name: Validate marketplace and plugin manifests
        run: claude plugin validate .

      - name: Parse YAML and JSON files
        run: |
          ruby -ryaml -rjson -e '
            bad = []
            yaml = Dir.glob(".github/**/*.{yml,yaml}") + Dir.glob("plugins/**/templates/**/*.{yml,yaml}") + Dir.glob("plugins/**/templates/**/*pre-commit-config*")
            json = Dir.glob(".claude-plugin/*.json") + Dir.glob("plugins/**/.claude-plugin/*.json") + Dir.glob("plugins/**/.mcp.json")
            yaml.each { |f| begin; YAML.load_file(f); rescue => e; bad << "#{f}: #{e.message}"; end }
            json.each { |f| begin; JSON.parse(File.read(f)); rescue => e; bad << "#{f}: #{e.message}"; end }
            abort(bad.join("\n")) unless bad.empty?
            puts "parsed #{yaml.size} yaml, #{json.size} json files"
          '

      - name: Check every skill has a docs page
        run: |
          missing=0
          for f in plugins/*/skills/*/SKILL.md; do
            name=$(basename "$(dirname "$f")")
            if [ ! -f "docs/$name.md" ]; then
              echo "::error file=$f::missing docs/$name.md (one human-readable page per skill)"
              missing=1
            fi
          done
          exit $missing

      - name: Check every plugin with agents has a docs page
        run: |
          missing=0
          for d in plugins/*/agents; do
            [ -d "$d" ] || continue
            plugin=$(basename "$(dirname "$d")")
            if [ ! -f "docs/$plugin.md" ]; then
              echo "::error file=$d::missing docs/$plugin.md (one human-readable page per plugin that ships agents)"
              missing=1
            fi
          done
          exit $missing

      # `gh issue view --json` has no authorAssociation field and fails with "Unknown JSON field".
      # Read it with `gh api repos/<repo>/issues/<n> --jq .author_association` instead.
      - name: Skills must not ask gh issue view for authorAssociation
        run: |
          if grep -rnE 'gh issue view[^`]*--json[^`]*authorAssociation' plugins/*/skills --include=SKILL.md; then
            echo "::error::gh issue view cannot return authorAssociation; use gh api repos/<repo>/issues/<n> --jq .author_association"
            exit 1
          fi

      # `gh repo view` takes the repository as an argument and has no --repo flag
      # (it fails with "unknown flag: --repo"). Write `gh repo view "$REPO"`.
      - name: Skills must not pass --repo to gh repo view
        run: |
          if grep -rnE 'gh repo view[^`]*--repo' plugins/*/skills --include=SKILL.md; then
            echo '::error::gh repo view has no --repo flag; pass the repository as an argument: gh repo view "$REPO"'
            exit 1
          fi

      # CONTRIBUTING: the version and the changelog change in the release PR only.
      # On a pull_request run HEAD is the merge commit, so HEAD^1 is the base it merges into.
      - name: Feature PRs must not bump the version or edit the changelog
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: |
          bad=0
          if git diff --name-only HEAD^1 HEAD | grep -qx 'CHANGELOG.md'; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md changes in the release PR, not in a feature PR"
            bad=1
          fi
          for f in plugins/*/.claude-plugin/plugin.json; do
            # A brand-new plugin legitimately starts with a version.
            git cat-file -e "HEAD^1:$f" 2>/dev/null || continue
            if git diff -U0 HEAD^1 HEAD -- "$f" | grep -qE '^[+-][[:space:]]*"version"'; then
              echo "::error file=$f::the version is bumped in the release PR (branch release/<version>), not in a feature PR"
              bad=1
            fi
          done
          exit $bad
